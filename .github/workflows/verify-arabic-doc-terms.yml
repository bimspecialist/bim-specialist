name: Verify Arabic Documentation Terms
on:
  push:
    branches: [fix/arabic-doc-terms-clean-20260902]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arabic-doc-terms-clean-20260902
      - name: RED - desired terminology must fail before fix
        shell: bash
        run: |
          set +e
          ! grep -q 'التوثيق' script.js
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'Expected RED failure but deprecated term is already absent.'
            exit 1
          fi
          echo 'RED confirmed: deprecated Arabic term is present.'
      - name: GREEN - replace deprecated Arabic documentation terminology at source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('script.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            '>التوثيق<':'>دليل الاستخدام<',
            '>قراءة التوثيق<':'>قراءة دليل الاستخدام<',
            'ابدأ بصفحة التوثيق، ثم استخدم الدعم لمشكلات التثبيت والتوافق والترخيص والميزات.':'ابدأ بصفحة دليل الاستخدام، ثم استخدم الدعم لمشكلات التثبيت والتوافق والترخيص والميزات.'
          }
          for old,new in replacements.items():
            s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: GREEN - verify deprecated terminology is gone
        run: |
          ! grep -q 'التوثيق' script.js
          grep -q 'دليل الاستخدام' script.js
          grep -q 'قراءة دليل الاستخدام' script.js
          echo 'GREEN confirmed: Arabic documentation terminology is consistent.'
      - name: Commit only the source fix
        run: |
          rm .github/workflows/verify-arabic-doc-terms.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .github/workflows/verify-arabic-doc-terms.yml
          git commit -m 'Fix Arabic documentation terminology at source'
          git push origin HEAD:fix/arabic-doc-terms-clean-20260902
