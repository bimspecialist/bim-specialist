name: BIM Measure 3D - Android APK
on:
  push:
    branches:
      - bim-measure-3d-android-build
      - bim-measure-3d-reliability-fixes
      - bim-measure-3d-ui-redesign
      - bim-measure-3d-infinix-gt20-ui
      - bim-measure-3d-v0.7-device-resilience
      - bim-measure-3d-v0.7.1-point-placement
      - bim-measure-3d-v0.7.2-audit-fixes
    paths:
      - 'BIMMeasure3D/**'
      - '.github/workflows/bim-measure-3d-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test and assemble Android APK
        working-directory: BIMMeasure3D
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIMMeasure3D-v0.7.2-audit-tests
          path: BIMMeasure3D/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Verify APK package and debug signature
        working-directory: BIMMeasure3D
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.bimspecialist.measure3d'"
      - name: Warn about ephemeral CI signatures
        run: echo 'CI DEBUG APK only. Do not install as the long-lived app. Use the separately published fixed-key signed release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIMMeasure3D-v0.7.2-CI-DEBUG-NOT-FOR-UPDATES
          path: BIMMeasure3D/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
