name: BIM Measure 3D - Android APK
on:
  push:
    branches:
      - bim-measure-3d-android-build
    paths:
      - 'BIMMeasure3D/**'
      - '.github/workflows/bim-measure-3d-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android API 37
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Assemble debug APK
        working-directory: BIMMeasure3D
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BIMMeasure3D-debug-apk
          path: BIMMeasure3D/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
