name: Apply Arabic Homepage Fix
on:
  push:
    branches: [fix/full-arabic-homepage-20260902]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch fixed English-only UI labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '<span>Rooms</span><span>Schedules</span><span>Model</span><span>Support</span>':'<span><span data-lang="en">Rooms</span><span data-lang="ar">الغرف</span></span><span><span data-lang="en">Schedules</span><span data-lang="ar">الجداول</span></span><span><span data-lang="en">Model</span><span data-lang="ar">النموذج</span></span><span><span data-lang="en">Support</span><span data-lang="ar">الدعم</span></span>',
            '<div class="previewMetrics"><span>ROOM WORKFLOWS</span><span>SCHEDULE WORKFLOWS</span><span>MODEL MANAGEMENT</span></div>':'<div class="previewMetrics"><span><span data-lang="en">ROOM WORKFLOWS</span><span data-lang="ar">مهام الغرف</span></span><span><span data-lang="en">SCHEDULE WORKFLOWS</span><span data-lang="ar">مهام الجداول</span></span><span><span data-lang="en">MODEL MANAGEMENT</span><span data-lang="ar">إدارة النموذج</span></span></div>',
            '<b>WORKFLOW</b>':'<b><span data-lang="en">WORKFLOW</span><span data-lang="ar">سير عمل</span></b>',
            '<b>GUIDE</b>':'<b><span data-lang="en">GUIDE</span><span data-lang="ar">دليل</span></b>'
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected source not found: '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: localize Arabic homepage UI labels'
          git push
